name: Review reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          APP_URL=$(printf '%s' "${APP_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]"'\'']*//' -e 's/[[:space:]"'\'']*$//' -e 's:/*$::')
          CRON_SECRET=$(printf '%s' "${CRON_SECRET:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]"'\'']*//' -e 's/[[:space:]"'\'']*$//')
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Aún no hay secrets APP_URL / CRON_SECRET. El form ya funciona; el mail a las 2h se activa cuando los pongas."
            exit 0
          fi
          case "$APP_URL" in
            http://*|https://*) ;;
            *) APP_URL="https://${APP_URL}" ;;
          esac
          echo "Pinging ${APP_URL}/api/cron/review-reminders"
          HTTP_CODE=$(curl -sS -o /tmp/cron.json -w "%{http_code}" -G "${APP_URL}/api/cron/review-reminders" --data-urlencode "secret=${CRON_SECRET}" || true)
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/cron.json
          echo
          test "$HTTP_CODE" = "200"
